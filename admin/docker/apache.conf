<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Админка открывается по пути /admin — так её проксирует nginx на хосте
    # (location /admin/ -> 127.0.0.1:3005). Laravel сам определяет базовый
    # путь /admin по SCRIPT_NAME, поэтому маршруты в коде без префикса.
    Alias /admin /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteBase /admin/
        # Корень админки -> дашборд прямо здесь: у закэшированных маршрутов Laravel
        # корень под подкаталогом с завершающим слэшем (/admin/) отдаёт 405.
        RewriteRule ^$ dashboard [R=302,L]
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
