# /etc/nginx/sites-available/dc-valley.com
#
# Продакшен: dc-valley.com. Это копия конфига, который стоял на сервере,
# с единственным изменением — блок `location /` больше не отдаёт статику
# с диска, а проксирует на Nuxt/Nitro в контейнере (127.0.0.1:3004).
#
# Заодно убраны location-блоки с кеш-заголовками для css/js/картинок:
# Nitro отдаёт свои ассеты сам и проставляет им корректный Cache-Control
# (хеш в имени файла + immutable), перебивать это снаружи не нужно.
#
# Установка:
#   cp deploy/nginx.prod.conf /etc/nginx/sites-available/dc-valley.com
#   nginx -t && systemctl reload nginx
#
# Требует запущенного `docker compose up -d --build` (см. docker-compose.yml:
# хост общий, порты 3000-3003 заняты другими проектами, поэтому 3004).
#
# Откат на статику — вернуть файл из бэкапа и перечитать конфиг.

# HTTP -> HTTPS redirect (apex)
server {
    listen 80;
    listen [::]:80;
    server_name dc-valley.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP -> HTTPS redirect (www)
server {
    listen 80;
    listen [::]:80;
    server_name www.dc-valley.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS www -> HTTPS apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dc-valley.com;

    ssl_certificate     /etc/letsencrypt/live/dc-valley.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dc-valley.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dc-valley.com$request_uri;
}

# HTTPS content (apex) -> Nuxt в контейнере
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dc-valley.com;

    ssl_certificate     /etc/letsencrypt/live/dc-valley.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dc-valley.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
