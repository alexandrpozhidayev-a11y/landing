# /etc/nginx/sites-available/data-center-valley.com
#
# Cutover config for once nuxt-app is what's actually being deployed —
# NOT the current production config (that's still nginx.conf, serving the
# static HTML files directly). Swap to this when you're ready to switch
# the live site over to the Nuxt app.
#
# nginx only terminates TLS and reverse-proxies here; the Nuxt/Nitro
# container serves its own static assets (with its own cache headers).
#
# Install:
#   sudo cp deploy/nginx.nuxt.conf /etc/nginx/sites-available/data-center-valley.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes `docker compose up -d` is already running in /var/www/landing,
# publishing the app on 127.0.0.1:3000 (see docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name www.data-center-valley.com;
    return 301 $scheme://data-center-valley.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name data-center-valley.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data-center-valley.com;

    ssl_certificate     /etc/letsencrypt/live/data-center-valley.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data-center-valley.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # TODO: once the Laravel admin/API service exists, proxy it here before
    # the catch-all `location /` below, e.g.:
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
