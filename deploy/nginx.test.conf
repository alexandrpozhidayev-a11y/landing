# /etc/nginx/sites-enabled/test.dc-valley.com.conf
#
# Cutover version of the file currently on the server — same domain, same
# Certbot-managed SSL block, same logs/gzip. Only change: `location /` now
# reverse-proxies to the Nuxt/Nitro container instead of serving static
# files from /var/www/DCV directly (Nitro serves its own static assets with
# its own cache headers, so the old css/js/image location block is dropped).
#
# Install:
#   cp deploy/nginx.test.conf /etc/nginx/sites-enabled/test.dc-valley.com.conf
#   nginx -t && systemctl reload nginx
#
# Assumes `docker compose up -d` is already running, publishing the app on
# 127.0.0.1:3004 (see docker-compose.yml — this is a shared host, ports
# 3000-3003 were already taken by other projects).

server {
    listen 80;
    listen [::]:80;
    server_name test.dc-valley.com;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    access_log /var/log/nginx/dc-valley-access.log;
    error_log  /var/log/nginx/dc-valley-error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.dc-valley.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.dc-valley.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
