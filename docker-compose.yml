services:
  web:
    build:
      context: ./nuxt-app
    restart: unless-stopped
    ports:
      # Shared host — 3000/3001/3002/3003 already taken by other projects'
      # node processes. 3004 on the host, container still listens on 3000
      # internally.
      - "127.0.0.1:3004:3000"
    environment:
      NODE_ENV: production

