services:
  web:
    build:
      context: ./nuxt-app
    restart: unless-stopped
    ports:
      # Shared host — 3000/3001/3002/3003 already taken by other projects'
      # node processes. 3004 on the host, container still listens on 3000
      # internally.
      - "127.0.0.1:3004:3000"
    environment:
      NODE_ENV: production

  # Админка (Laravel, папка admin/) — https://dc-valley.com/admin
  # nginx на хосте проксирует /admin/ -> 127.0.0.1:3005 (deploy/nginx.prod.conf).
  # База SQLite, загруженные фото и APP_KEY — в томе admin-storage: переживают
  # пересборку. При старте: миграции + тестовый пользователь (AdminUserSeeder).
  admin:
    build:
      context: ./admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    environment:
      APP_NAME: "DCV Admin"
      APP_ENV: production
      APP_DEBUG: "false"
      # Для локального запуска: ADMIN_URL=http://127.0.0.1:3005/admin ADMIN_SECURE_COOKIE=false
      APP_URL: ${ADMIN_URL:-https://dc-valley.com/admin}
      APP_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      SESSION_DRIVER: file
      SESSION_PATH: /admin
      SESSION_SECURE_COOKIE: ${ADMIN_SECURE_COOKIE:-true}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
    volumes:
      - admin-storage:/var/www/html/storage

volumes:
  admin-storage:
